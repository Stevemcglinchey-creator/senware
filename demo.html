<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Senware — Full Prototype (Roles, Dark, Print, CSV, Handover)</title>

<!-- Tailwind (play) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React UMD -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --bg: #eef8f2;
    --card: #ffffff;
    --accent: #2f7a53;
    --muted: #59606a;
    --danger: #ef4444;
    --high: #fee2e2;
    --med: #fffbeb;
    --low: #ecfdf5;
  }
  [data-theme="dark"] {
    --bg: #0b1220;
    --card: #0f1724;
    --accent: #7dd3a6;
    --muted: #94a3b8;
    color: #e6eef2;
  }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; color: #0f1724; }
  [data-theme="dark"] body { color: #e6eef2; }
  .app { max-width:1200px; margin:18px auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; box-shadow:0 6px 18px rgba(2,6,23,0.06); }
  .muted { color:var(--muted); }
  .sticky-top { position: sticky; top:0; z-index:20; }
  .risk-high { box-shadow: 0 0 0 3px rgba(239,68,68,0.06); }
  .risk-med { box-shadow: 0 0 0 3px rgba(245,158,11,0.04); }
  .risk-low { box-shadow: 0 0 0 3px rgba(16,185,129,0.04); }
  /* print styles for substitute sheet */
  @media print {
    body { background: white !important; }
    .no-print { display:none !important; }
    .card { box-shadow:none !important; border-radius:0 !important; }
  }
  .pill { padding:4px 8px; border-radius:999px; font-weight:600; font-size:0.75rem; }
</style>
</head>

<body data-theme="light">
<div id="root" class="app"></div>

<script type="text/babel">
/* Senware Full Prototype — single-file React */
const { useState, useEffect, useMemo } = React;

/* -------------------------
   Demo dataset (students, checkins, alerts)
   ------------------------- */
const DEMO_STUDENTS = [
  { id:'stu-001', name:"Sam O'Connor", year:"1st Year", sna:"Sarah O'Donnell", condition:"Diabetic", birthday:"2009-03-15", highRisk:"Monitor blood glucose", triggers:"Missed meds; change of routine", supports:"Assigned SNA; 1:1 reading", passport:"Carry glucose tablets", risk:"high" },
  { id:'stu-002', name:"Ella Murphy", year:"2nd Year", sna:"Liam Harris", condition:"Anxiety", birthday:"2009-05-12", highRisk:"May freeze; needs calm entry", triggers:"Loud corridors; assemblies", supports:"Quiet entry; grounding", passport:"Allow early exit", risk:"med" },
  { id:'stu-003', name:"Jack Nolan", year:"3rd Year", sna:"Maya O'Reilly", condition:"Behaviour Support", birthday:"2008-11-20", highRisk:"Verbal escalation", triggers:"Transitions; peer conflict", supports:"Behaviour plan; SNA escort", passport:"Safe-room access", risk:"high" }
];

const INITIAL_CHECKINS = [
  { id:'c-1', studentId:'stu-001', type:'parent', text:"Parent: Forgot morning meds; will bring at 9:30", createdAt:new Date().toLocaleString(), author:'Parent' },
  { id:'c-2', studentId:'stu-003', type:'behaviour', text:"Teacher: Aggressive incident in corridor", createdAt:new Date().toLocaleString(), author:'Teacher' }
];

const INITIAL_ALERTS = [
  { id:'a-1', studentId:'stu-001', title:"Sam — Parent drop", message:"Parent: Forgot meds — dropping to school", time:new Date().toLocaleTimeString(), from:'Parent', to:['Assigned SNA','SENCO'], priority:'high' },
  { id:'a-2', studentId:'stu-003', title:"Jack — Behaviour", message:"Aggressive incident — deputy notified", time:new Date().toLocaleTimeString(), from:'Teacher', to:['Behaviour Team','Deputy Principal'], priority:'med' }
];

/* -------------------------
   Roles & helpers
   ------------------------- */
const ROLES = ['SNA','Teacher','Deputy Principal','SENCO','Principal','Attendance Officer','Substitute'];

const uid = (p='id') => p + '-' + Math.random().toString(36).slice(2,9);

function routeRecipientsForText(text, forced=false){
  const t = (text||'').toLowerCase();
  const rec = new Set();
  if(t.includes('med')||t.includes('inhaler')||t.includes('diabet')) { rec.add('Assigned SNA'); rec.add('First Aid'); }
  if(t.includes('aggress')||t.includes('push')||t.includes('shout')) { rec.add('Behaviour Team'); rec.add('Deputy Principal'); }
  if(t.includes('absent')||t.includes('missing')) { rec.add('Attendance Officer'); }
  if(forced) rec.add('Immediate Response Team');
  if(rec.size===0) rec.add('Assigned SNA');
  return Array.from(rec);
}

function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

/* -------------------------
   UI components
   ------------------------- */

function TopBar({ role, setRole, theme, toggleTheme, exportLogs, exportAttendance, openOnboarding }){
  return (
    <div className="flex items-center justify-between mb-4 no-print">
      <div className="flex items-center gap-3">
        <div className="w-12 h-12 rounded bg-emerald-600 text-white flex items-center justify-center font-bold">SW</div>
        <div>
          <div className="text-xl font-semibold" style={{color:'var(--accent)'}}>Senware — Demo</div>
          <div className="text-sm muted">Role-aware alerts • Substitute-ready • Handover generator</div>
        </div>
      </div>

      <div className="flex items-center gap-2">
        <select value={role} onChange={e=> setRole(e.target.value)} className="p-2 border rounded text-sm">
          {ROLES.map(r=> <option key={r} value={r}>{r}</option>)}
        </select>

        <button onClick={toggleTheme} className="px-3 py-2 bg-white border rounded text-sm">{ theme === 'light' ? 'Dark' : 'Light' }</button>

        <div className="flex gap-2">
          <button onClick={exportLogs} className="px-3 py-2 bg-white border rounded text-sm">Export logs</button>
          <button onClick={exportAttendance} className="px-3 py-2 bg-white border rounded text-sm">Export attendance</button>
          <button onClick={openOnboarding} className="px-3 py-2 bg-emerald-600 text-white rounded text-sm">Walkthrough</button>
        </div>
      </div>
    </div>
  );
}

/* Student list with risk traffic light */
function StudentList({ students, selectedId, setSelectedId }) {
  return (
    <div className="card p-3 max-h-[72vh] overflow-y-auto">
      <div className="sticky-top mb-2 font-semibold">Students</div>
      {students.map(s => {
        const cls = s.risk === 'high' ? 'risk-high' : s.risk === 'med' ? 'risk-med' : 'risk-low';
        return (
          <div key={s.id} onClick={()=> setSelectedId(s.id)} className={`p-3 rounded mb-2 cursor-pointer ${selectedId===s.id ? 'bg-emerald-50 border border-emerald-100' : 'hover:bg-slate-50' } ${cls}`}>
            <div className="flex justify-between items-start">
              <div>
                <div className="font-medium">{s.name}</div>
                <div className="text-xs muted">{s.year} • SNA: {s.sna}</div>
              </div>
              <div className="text-xs">
                { s.risk === 'high' && <span className="px-2 py-1 rounded-full text-xs bg-red-100 text-red-700">High</span> }
                { s.risk === 'med' && <span className="px-2 py-1 rounded-full text-xs bg-amber-100 text-amber-700">Med</span> }
                { s.risk === 'low' && <span className="px-2 py-1 rounded-full text-xs bg-green-100 text-green-700">Low</span> }
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* Student profile */
function StudentProfile({ student, checkins }) {
  if(!student) return <div className="card p-4 muted">Select a student</div>;
  const recent = checkins.filter(c=>c.studentId===student.id).slice(0,6);
  return (
    <div className="card p-4 space-y-2">
      <div className="flex justify-between items-start">
        <div>
          <div className="text-xl font-semibold">{student.name}</div>
          <div className="text-sm muted">{student.year} • SNA: {student.sna}</div>
        </div>
        <div className="text-sm muted">
          <div>🎂 {student.birthday}</div>
          <div className="mt-2 pill" style={{background: student.risk === 'high' ? '#fee2e2' : (student.risk==='med' ? '#fffbeb' : '#ecfdf5')}}>{student.risk.toUpperCase()}</div>
        </div>
      </div>

      <div className="text-sm">
        <div><strong>Condition:</strong> {student.condition}</div>
        <div><strong>High-risk:</strong> {student.highRisk}</div>
        <div><strong>Triggers:</strong> {student.triggers}</div>
        <div><strong>Supports:</strong> {student.supports}</div>
        <div><strong>Timetable:</strong> {student.timetable}</div>
        <div><strong>Passport:</strong> {student.passport}</div>
      </div>

      <div>
        <div className="text-sm font-semibold mt-2">Recent notes</div>
        <div className="mt-2 space-y-2">
          {recent.length === 0 ? <div className="muted small">No recent notes</div> : recent.map(r=> (
            <div key={r.id} className="p-2 border rounded bg-emerald-50">
              <div className="text-xs muted">{r.createdAt} • {r.author}</div>
              <div className="mt-1">{r.text}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* Alerts panel: supports role-filter and 'for me' toggle */
function AlertsPanel({ alerts, students, role, acknowledge, followUp }) {
  const [recipient, setRecipient] = useState('all');
  const [priority, setPriority] = useState('all');
  const [q, setQ] = useState('');
  const [forMe, setForMe] = useState(true); // default show only alerts relevant to role

  const recipients = useMemo(()=> {
    const setR = new Set();
    alerts.forEach(a => (a.to||[]).forEach(t => setR.add(t)));
    return ['all', ...Array.from(setR)];
  }, [alerts]);

  const filtered = alerts.filter(a => {
    if(forMe && role) {
      // check if role is included in recipients OR if 'Assigned SNA' and role is SNA and assigned SNA matches (we'll skip per-student matching here)
      if(!((a.to||[]).includes(role) || role==='SNA' && (a.to||[]).includes('Assigned SNA'))) return false;
    }
    if(recipient !== 'all' && !(a.to||[]).includes(recipient)) return false;
    if(priority !== 'all' && a.priority !== priority) return false;
    if(q && !(a.message.toLowerCase().includes(q.toLowerCase()) || a.title.toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  });

  return (
    <div className="card p-4">
      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="font-semibold">Alerts</div>
          <div className="text-xs muted">Realtime routing & role-aware filter</div>
        </div>
        <div className="text-sm muted">{alerts.length} total</div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-4 gap-2 mb-3">
        <input placeholder="Search..." value={q} onChange={e=>setQ(e.target.value)} className="p-2 border rounded" />
        <select value={recipient} onChange={e=>setRecipient(e.target.value)} className="p-2 border rounded">
          {recipients.map(r => <option key={r} value={r}>{r}</option>)}
        </select>
        <select value={priority} onChange={e=>setPriority(e.target.value)} className="p-2 border rounded">
          <option value="all">All priorities</option>
          <option value="high">High</option>
          <option value="med">Med</option>
          <option value="low">Low</option>
        </select>
        <div className="flex items-center gap-2">
          <input type="checkbox" checked={forMe} onChange={e=>setForMe(e.target.checked)} id="forMe" />
          <label htmlFor="forMe" className="text-sm muted">Only show alerts for <strong className="ml-1">{role}</strong></label>
        </div>
      </div>

      <div className="max-h-[36vh] overflow-y-auto">
        {filtered.length === 0 ? <div className="muted text-sm">No alerts</div> : filtered.map(a => {
          const student = students.find(s=>s.id===a.studentId) || {};
          const cls = a.priority === 'high' ? 'border-l-4 border-red-400 bg-[#fff1f0]' : a.priority==='med' ? 'border-l-4 border-amber-400 bg-[#fffbeb]' : 'border-l-4 border-green-400 bg-[#ecfdf5]';
          return (
            <div key={a.id} className={`p-3 mb-3 rounded ${cls}`}>
              <div className="flex justify-between">
                <div>
                  <div className="font-semibold">{a.title} • {student.name}</div>
                  <div className="text-sm muted mt-1">{a.message}</div>
                  <div className="text-xs muted mt-2">From: <strong>{a.from}</strong> • To: <strong>{(a.to||[]).join(', ')}</strong></div>
                </div>
                <div className="flex flex-col gap-2">
                  <button onClick={()=>acknowledge(a.id)} className="px-3 py-1 bg-white border rounded text-sm">Acknowledge</button>
                  <button onClick={()=>followUp(a.id)} className="px-3 py-1 bg-emerald-600 text-white rounded text-sm">Follow-up</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Substitute view with print button and sticky headers */
function SubstituteView({ students, checkins, onCopyPTM }) {
  const [filter, setFilter] = useState('');
  const [expanded, setExpanded] = useState({});
  const [snaFilter, setSnaFilter] = useState('all');

  const snaList = useMemo(()=> [...new Set(students.map(s=>s.sna))], [students]);

  const list = students.filter(s => {
    const q = filter.trim().toLowerCase();
    if(q && !(s.name.toLowerCase().includes(q) || s.condition.toLowerCase().includes(q))) return false;
    if(snaFilter !== 'all' && s.sna !== snaFilter) return false;
    return true;
  });

  function toggle(id){ setExpanded(p=>({ ...p, [id]: !p[id] })); }
  function printSheet(){ window.print(); }

  return (
    <div className="card p-4">
      <div className="flex justify-between items-center mb-3">
        <div>
          <div className="font-semibold">Substitute View</div>
          <div className="text-xs muted">Sticky headers for quick scanning</div>
        </div>
        <div className="flex gap-2 no-print">
          <button onClick={printSheet} className="px-3 py-2 bg-white border rounded">Print</button>
        </div>
      </div>

      <div className="flex gap-2 mb-3">
        <input placeholder="Search by name or condition" value={filter} onChange={e=>setFilter(e.target.value)} className="p-2 border rounded flex-1" />
        <select value={snaFilter} onChange={e=>setSnaFilter(e.target.value)} className="p-2 border rounded">
          <option value="all">All SNAs</option>
          {snaList.map(s=> <option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <div className="max-h-[60vh] overflow-y-auto pr-2">
        {list.map(s => (
          <div key={s.id} className="mb-4 border rounded bg-white">
            <div className="sticky-top p-3 bg-emerald-50 flex justify-between items-center border-b">
              <div>
                <div className="font-semibold">{s.name} • {s.year}</div>
                <div className="text-xs muted">SNA: {s.sna}</div>
              </div>
              <div className="flex items-center gap-2">
                <div className="text-xs muted">🎂 {s.birthday}</div>
                <button onClick={()=>toggle(s.id)} className="px-2 py-1 bg-white border rounded text-sm">{expanded[s.id] ? 'Collapse' : 'Expand'}</button>
              </div>
            </div>

            {expanded[s.id] && (
              <div className="p-3 small">
                <div><strong>Condition:</strong> {s.condition}</div>
                <div className="mt-1"><strong>High-risk:</strong> {s.highRisk}</div>
                <div className="mt-1"><strong>Triggers:</strong> {s.triggers}</div>
                <div className="mt-1"><strong>Supports:</strong> {s.supports}</div>

                <div className="mt-2">
                  <strong>Recent notes</strong>
                  <div className="mt-2 space-y-2">
                    {checkins.filter(c=>c.studentId===s.id).slice(0,4).map(n=>(
                      <div key={n.id} className="p-2 border rounded bg-emerald-50">
                        <div className="text-xs muted">{n.createdAt} • {n.author}</div>
                        <div className="mt-1">{n.text}</div>
                      </div>
                    ))}
                    {checkins.filter(c=>c.studentId===s.id).length === 0 && <div className="muted small">No notes</div>}
                  </div>
                </div>

                <div className="mt-3 flex gap-2">
                  <button onClick={()=> onCopyPTM(s.id) } className="px-3 py-2 bg-emerald-600 text-white rounded">Copy PTM</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* Attendance panel with CSV export */
function AttendancePanel({ students, attendance, togglePresent, exportAttendance }) {
  const today = new Date().toISOString().slice(0,10);
  const day = attendance[today] || students.map(s=>({ studentId:s.id, present:true }));
  const presentCount = day.filter(d=>d.present).length;

  return (
    <div className="card p-4">
      <div className="flex justify-between items-center mb-3">
        <div>
          <div className="font-semibold">Attendance — {today}</div>
          <div className="text-xs muted">Quick tracker</div>
        </div>
        <div className="text-sm muted">{presentCount}/{students.length} present</div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        {students.map(s => {
          const rec = day.find(d=>d.studentId===s.id) || { present:true };
          return (
            <div key={s.id} className="p-3 border rounded bg-white flex justify-between items-center">
              <div>
                <div className="font-medium">{s.name}</div>
                <div className="text-xs muted">{s.year}</div>
              </div>
              <div className="flex flex-col items-end gap-2">
                <button onClick={()=> togglePresent(s.id, today)} className={`px-3 py-1 rounded text-sm ${rec.present ? 'bg-emerald-600 text-white' : 'bg-white border'}`}>{rec.present ? 'Present' : 'Absent'}</button>
                <div className="text-xs muted">{rec.present ? '—' : 'Marked absent'}</div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="mt-3 flex gap-2">
        <button className="px-3 py-2 bg-white border rounded" onClick={exportAttendance}>Export CSV</button>
      </div>
    </div>
  );
}

/* Handover panel + automated summary generator */
function HandoverPanel({ students, handovers, draft, setDraft, createDraft, approveDispatch, generateSummaryFor }) {
  return (
    <div className="card p-4">
      <div className="flex justify-between items-center">
        <div className="font-semibold">SNA Handover</div>
        <div className="text-xs muted">Create & dispatch</div>
      </div>

      <div className="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <div className="text-xs muted">Your name</div>
          <input className="mt-1 p-2 border rounded w-full" value={draft.author} onChange={e=> setDraft({...draft, author:e.target.value})} />

          <div className="text-xs muted mt-2">Notes</div>
          <textarea className="mt-1 p-2 border rounded w-full" rows="3" value={draft.notes} onChange={e=> setDraft({...draft, notes:e.target.value})} />

          <div className="text-xs muted mt-2">Tasks</div>
          <textarea className="mt-1 p-2 border rounded w-full" rows="2" value={draft.tasks} onChange={e=> setDraft({...draft, tasks:e.target.value})} />
        </div>

        <div>
          <div className="text-xs muted">Students covered</div>
          <div className="mt-1 space-y-1">
            {students.map(s => (
              <label key={s.id} className="flex items-center gap-2">
                <input type="checkbox" checked={draft.students.includes(s.id)} onChange={e=>{
                  const next = e.target.checked ? [...draft.students, s.id] : draft.students.filter(x=>x!==s.id);
                  setDraft({...draft, students: next});
                }} />
                <span className="text-sm">{s.name}</span>
              </label>
            ))}
          </div>

          <div className="mt-3 flex gap-2">
            <button onClick={createDraft} className="flex-1 px-3 py-2 bg-emerald-600 text-white rounded">Create draft</button>
            <button onClick={()=> setDraft({ author:'', notes:'', tasks:'', students:[students[0].id] })} className="flex-1 px-3 py-2 bg-white border rounded">Clear</button>
          </div>

          <div className="mt-3">
            <div className="text-xs muted mb-1">Generate automatic summary for a student</div>
            <select onChange={e=> generateSummaryFor(e.target.value)} className="p-2 border rounded w-full">
              <option value="">Choose student</option>
              {students.map(s=> <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div className="mt-4">
        <h4 className="text-sm font-semibold">Existing handovers</h4>
        <div className="mt-2 space-y-2">
          {handovers.length === 0 ? <div className="muted text-sm">No handovers yet</div> : handovers.map(h => (
            <div key={h.id} className="p-3 border rounded bg-white flex justify-between">
              <div>
                <div className="font-medium">By {h.author} • {h.createdAt}</div>
                <div className="text-xs muted">Status: {h.status}</div>
                <div className="text-xs muted">Students: {h.students.map(id => (students.find(s=>s.id===id)||{}).name).join(', ')}</div>
              </div>
              <div>
                {h.status === 'Draft' && <button onClick={()=> approveDispatch(h.id)} className="px-3 py-1 bg-emerald-600 text-white rounded">Approve & Dispatch</button>}
                {h.status === 'Dispatched' && <div className="text-xs muted">Dispatched</div>}
                {h.status === 'Expired' && <div className="text-xs muted">Expired</div>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* Analytics (placeholders) */
function AnalyticsCard({ alerts, checkins }) {
  return (
    <div className="card p-4">
      <div className="font-semibold">Analytics (demo)</div>
      <div className="mt-3 grid grid-cols-1 md:grid-cols-3 gap-3">
        <div className="p-3 border rounded bg-white small"><div className="text-xs muted">Alerts</div><div className="text-2xl font-bold">{alerts.length}</div></div>
        <div className="p-3 border rounded bg-white small"><div className="text-xs muted">Flagged students</div><div className="text-2xl font-bold">{new Set(checkins.map(c=>c.studentId)).size}</div></div>
        <div className="p-3 border rounded bg-white small"><div className="text-xs muted">Avg response</div><div className="text-2xl font-bold">7m</div></div>
      </div>
    </div>
  );
}

/* -------------------------
   APP root
   ------------------------- */

function App(){
  const [students, setStudents] = useState(DEMO_STUDENTS);
  const [checkins, setCheckins] = useState(INITIAL_CHECKINS);
  const [alerts, setAlerts] = useState(INITIAL_ALERTS);
  const [handovers, setHandovers] = useState([]);
  const [handDraft, setHandDraft] = useState({ author:'', notes:'', tasks:'', students:[DEMO_STUDENTS[0].id] });
  const [selectedStudentId, setSelectedStudentId] = useState(students[0].id);
  const [role, setRole] = useState('SNA');
  const [theme, setTheme] = useState('light');
  const [attendance, setAttendance] = useState(() => {
    const today = new Date().toISOString().slice(0,10);
    const arr = students.map(s=>({ studentId:s.id, present:true }));
    return { [today]: arr };
  });
  const [viewTab, setViewTab] = useState('profile');
  const [showOnboarding, setShowOnboarding] = useState(true);

  useEffect(()=> {
    document.body.setAttribute('data-theme', theme);
  }, [theme]);

  /* checkin + alert creation */
  function addCheckin({ studentId, type, text, author='SNA', priority='low', urgent=false }){
    const item = { id: uid('c'), studentId, type, text, author, createdAt: new Date().toLocaleString() };
    setCheckins(prev => [item, ...prev].slice(0,500));
    const recips = routeRecipientsForText(text, urgent);
    const alert = { id: uid('a'), studentId, title: `${(students.find(s=>s.id===studentId)||{}).name} → ${recips[0]}`, message: text, time: new Date().toLocaleTimeString(), from: author, to: recips, priority };
    setAlerts(prev => [alert, ...prev].slice(0,200));
    return item;
  }

  function acknowledge(id){ setAlerts(prev => prev.filter(a=>a.id !== id)); flash('Acknowledged') }
  function followUp(id){ const a = alerts.find(x=>x.id===id); if(!a) return; addCheckin({ studentId:a.studentId, type:'support', text:'Follow-up: '+a.message, author:'SENCO' }); flash('Follow-up created') }

  /* quick note */
  function quickSave(note, type, priority='low'){ if(!note) return alert('Enter note'); addCheckin({ studentId:selectedStudentId, type, text:note, author:role, priority }); flash('Saved') }

  /* handovers */
  function createDraft(){
    if(!handDraft.author) return alert('Enter author name');
    const h = { id: uid('h'), ...handDraft, createdAt: new Date().toLocaleString(), status: 'Draft', token:null, expiresAt:null };
    setHandovers(prev => [h, ...prev]);
    setHandDraft({...handDraft, notes:'', tasks:''});
    flash('Draft created');
  }
  function approveDispatch(hid){
    const h = handovers.find(x=>x.id===hid); if(!h) return;
    const expiresMs = 1000*60*60*8;
    const token = btoa(JSON.stringify({ payload: h, exp: Date.now() + expiresMs }));
    const updated = { ...h, status: 'Dispatched', token, expiresAt: Date.now() + expiresMs };
    setHandovers(prev => prev.map(x=> x.id===hid ? updated : x));
    try { navigator.clipboard.writeText(token); flash('Dispatched & token copied'); } catch(e){ flash('Dispatched'); }
  }
  useEffect(()=> {
    const t = setInterval(()=> {
      setHandovers(prev => prev.map(h => {
        if(h.expiresAt && Date.now() > h.expiresAt && h.status === 'Dispatched') return { ...h, status: 'Expired' };
        return h;
      }));
    }, 3000);
    return ()=> clearInterval(t);
  }, []);

  function subViewWithToken(token){
    try{
      const decoded = JSON.parse(atob(token));
      if(!decoded || decoded.exp < Date.now()) return alert('Invalid or expired token');
      const payload = decoded.payload;
      alert(`Substitute Handover\nAuthor: ${payload.author}\nNotes: ${payload.notes}\nTasks: ${payload.tasks}\nStudents: ${payload.students.join(', ')}`);
    } catch(e) { alert('Invalid token'); }
  }

  /* attendance functions */
  function togglePresent(studentId, dateStr){
    setAttendance(prev => {
      const day = prev[dateStr] ? [...prev[dateStr]] : students.map(s=>({ studentId:s.id, present:true }));
      const idx = day.findIndex(d=>d.studentId===studentId);
      if(idx >= 0) day[idx].present = !day[idx].present;
      else day.push({ studentId, present:false });
      return { ...prev, [dateStr]: day };
    });
  }
  function exportAttendanceCSV(){
    const rows = [['date','studentId','studentName','present']];
    Object.keys(attendance).forEach(date => {
      attendance[date].forEach(rec => {
        const s = students.find(x=>x.id===rec.studentId) || {};
        rows.push([date, rec.studentId, s.name || rec.studentId, rec.present ? 'present' : 'absent']);
      });
    });
    downloadCSV('attendance.csv', rows);
    flash('Attendance exported');
  }

  /* analytics / quick exports */
  function exportLogs(){
    const rows = [['studentId','type','text','createdAt','author']];
    checkins.forEach(c=> rows.push([c.studentId, c.type, c.text, c.createdAt, c.author]));
    downloadCSV('senware-checkins.csv', rows);
    flash('Logs exported');
  }

  /* automated handover summary generator (single student) */
  function generateSummaryFor(studentId){
    if(!studentId) return;
    const s = students.find(x=>x.id===studentId);
    const recentNotes = checkins.filter(c=>c.studentId===studentId).slice(0,6);
    const recentAlerts = alerts.filter(a=>a.studentId===studentId).slice(0,6);
    const today = new Date().toISOString().slice(0,10);
    const att = attendance[today] || students.map(s=>({ studentId:s.id, present:true }));
    const present = att.filter(a=>a.present).length;
    const lines = [
      `Handover summary — ${s.name} (${s.year})`,
      `Assigned SNA: ${s.sna}`,
      `Birthday: ${s.birthday}`,
      `Condition: ${s.condition}`,
      `High-risk: ${s.highRisk}`,
      `Triggers: ${s.triggers}`,
      `Supports: ${s.supports}`,
      '',
      'Recent notes:'
    ];
    if(recentNotes.length === 0) lines.push('- none'); else recentNotes.forEach(n => lines.push(`- [${n.type}] ${n.text} (${n.createdAt}) by ${n.author}`));
    lines.push('', 'Recent alerts:');
    if(recentAlerts.length === 0) lines.push('- none'); else recentAlerts.forEach(a => lines.push(`- ${a.title}: ${a.message} (${a.time})`));
    lines.push('', `Attendance today: Present ${present}/${students.length}`);
    const text = lines.join('\n');
    try { navigator.clipboard.writeText(text); flash('Handover summary copied'); } catch(e){ alert(text); }
  }

  /* helper flash */
  function flash(msg){ const el = document.createElement('div'); el.className='fixed bottom-6 right-6 px-4 py-2 rounded-lg text-white z-50 bg-emerald-700'; el.innerText=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }

  /* initial simple sample functions to simulate incoming notes */
  function simulateParentNote(){
    addCheckin({ studentId: selectedStudentId, type:'parent', text:'Parent: Forgot meds; will bring at 9:30', author:'Parent', priority:'high', urgent:true });
    flash('Simulated parent note');
  }

  const selectedStudent = students.find(s=>s.id===selectedStudentId);

  /* main render */
  return (
    <div>
      <TopBar role={role} setRole={setRole} theme={theme} toggleTheme={()=> setTheme(t => t==='light' ? 'dark' : 'light')} exportLogs={exportLogs} exportAttendance={exportAttendanceCSV} openOnboarding={()=> setShowOnboarding(true)} />

      <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div className="col-span-1 space-y-4">
          <StudentList students={students} selectedId={selectedStudentId} setSelectedId={setSelectedStudentId} />

          <div className="card p-4">
            <div className="font-semibold">Quick Note</div>
            <div className="text-xs muted mb-2">Fast capture for SNA flow</div>
            <QuickNoteBox onSave={(txt, type)=> quickSave(txt, type)} onUrgent={(txt, type)=> addCheckin({ studentId:selectedStudentId, type, text:txt, author:role, priority:'high', urgent:true })} simulateParentNote={simulateParentNote} />
          </div>

          <HandoverPanel students={students} handovers={handovers} draft={handDraft} setDraft={setHandDraft} createDraft={createDraft} approveDispatch={approveDispatch} generateSummaryFor={generateSummaryFor} />
        </div>

        <div className="col-span-1 lg:col-span-2 space-y-4">
          <div className="card p-4 flex justify-between items-center">
            <div>
              <div className="font-semibold">Overview</div>
              <div className="text-xs muted">Role: <strong>{role}</strong> • View: <strong>{viewTab}</strong></div>
            </div>
            <div className="flex gap-2 no-print">
              <button onClick={()=> setViewTab('profile')} className={`px-3 py-2 rounded ${viewTab==='profile' ? 'bg-emerald-700 text-white' : 'bg-white border'}`}>Profile</button>
              <button onClick={()=> setViewTab('alerts')} className={`px-3 py-2 rounded ${viewTab==='alerts' ? 'bg-emerald-700 text-white' : 'bg-white border'}`}>Alerts</button>
              <button onClick={()=> setViewTab('substitute')} className={`px-3 py-2 rounded ${viewTab==='substitute' ? 'bg-emerald-700 text-white' : 'bg-white border'}`}>Substitute</button>
              <button onClick={()=> setViewTab('attendance')} className={`px-3 py-2 rounded ${viewTab==='attendance' ? 'bg-emerald-700 text-white' : 'bg-white border'}`}>Attendance</button>
            </div>
          </div>

          {viewTab === 'profile' && <StudentProfile student={selectedStudent} checkins={checkins} />}

          {viewTab === 'alerts' && <AlertsPanel alerts={alerts} students={students} role={role} acknowledge={acknowledge} followUp={followUp} />}

          {viewTab === 'attendance' && <AttendancePanel students={students} attendance={attendance} togglePresent={togglePresent} exportAttendance={exportAttendanceCSV} />}

          {viewTab === 'substitute' && <SubstituteView students={students} checkins={checkins} onCopyPTM={generateSummaryFor} />}
        </div>

        <div className="col-span-1 space-y-4">
          <div className="card p-4">
            <div className="font-semibold">Actions</div>
            <div className="mt-2 space-y-2">
              <button onClick={()=> { const t = prompt('Paste handover token (demo)'); if(t) subViewWithToken(t); }} className="w-full px-3 py-2 bg-white border rounded">Simulate token</button>
              <button onClick={simulateParentNote} className="w-full px-3 py-2 bg-emerald-600 text-white rounded">Simulate parent note</button>
              <button onClick={exportLogs} className="w-full px-3 py-2 bg-white border rounded">Export logs</button>
            </div>
          </div>

          <AnalyticsCard alerts={alerts} checkins={checkins} />

          <div className="card p-4 no-print">
            <div className="font-semibold">Onboarding</div>
            <div className="text-xs muted mt-2">Use the Walkthrough button to re-open the tour.</div>
          </div>
        </div>
      </div>

      {/* Onboarding modal */}
      { showOnboarding && <OnboardingModal close={()=> setShowOnboarding(false)} /> }
    </div>
  );
}

/* QuickNoteBox component */
function QuickNoteBox({ onSave, onUrgent, simulateParentNote }) {
  const [txt, setTxt] = useState('');
  const [type, setType] = useState('parent');

  return (
    <div>
      <select value={type} onChange={e=>setType(e.target.value)} className="p-2 border rounded w-full mb-2">
        <option value="parent">Parent</option>
        <option value="medical">Medical</option>
        <option value="behaviour">Behaviour</option>
        <option value="support">Support</option>
        <option value="attendance">Attendance</option>
      </select>
      <textarea rows="2" placeholder="Short note..." className="p-2 border rounded w-full" value={txt} onChange={e=>setTxt(e.target.value)} />
      <div className="mt-2 flex gap-2">
        <button onClick={()=> { onSave(txt, type); setTxt(''); }} className="flex-1 px-3 py-2 bg-emerald-600 text-white rounded">Save</button>
        <button onClick={()=> { onUrgent(txt, type); setTxt(''); }} className="flex-1 px-3 py-2 bg-red-600 text-white rounded">Urgent</button>
      </div>
      <div className="mt-2 flex gap-2">
        <button onClick={simulateParentNote} className="text-xs muted">Simulate parent note</button>
      </div>
    </div>
  );
}

/* Onboarding modal */
function OnboardingModal({ close }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/30">
      <div className="card p-6 max-w-lg w-full">
        <h2 className="text-xl font-semibold" style={{color:'var(--accent)'}}>Quick Walkthrough</h2>
        <ol className="mt-3 list-decimal pl-5 space-y-2">
          <li><strong>Role selector:</strong> switch to see alerts relevant to that role (SNA / SENCO / Deputy etc.).</li>
          <li><strong>Alerts:</strong> clearly shows who it's from and who it's routed to — acknowledge or create follow-up.</li>
          <li><strong>Substitute view & PTM:</strong> sticky headers & printable sheets for quick scan and handover.</li>
        </ol>
        <div className="mt-4 flex justify-end gap-2">
          <button onClick={close} className="px-3 py-2 bg-white border rounded">Close</button>
          <button onClick={()=> { close(); }} className="px-3 py-2 bg-emerald-600 text-white rounded">Got it</button>
        </div>
      </div>
    </div>
  );
}

/* helper subViewWithToken used for simulation */
function subViewWithToken(token){
  try {
    const decoded = JSON.parse(atob(token));
    if(!decoded || decoded.exp < Date.now()) return alert('Invalid or expired token');
    const payload = decoded.payload;
    alert(`Substitute Handover\nAuthor: ${payload.author}\nNotes: ${payload.notes}\nTasks: ${payload.tasks}\nStudents: ${payload.students.join(', ')}`);
  } catch(e) { alert('Invalid token'); }
}

/* Render app */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
